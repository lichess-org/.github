name: Reviewable

on:
  workflow_call:

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Ensure maintainers can modify PR
        if: github.event.pull_request.head.repo.full_name != github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          can_modify=$(gh pr view "$PR" --json maintainerCanModify --jq '.maintainerCanModify')
          is_closed=$(gh pr view "$PR" --json closed --jq '.closed')
          if [ "$is_closed" = "true" ]; then
            echo "PR is closed, skipping check for maintainer modifications"
          elif [ "$can_modify" = "true" ]; then
            echo "✅ Maintainers can modify the PR"
          else
            echo "❌ Maintainers cannot modify the PR"
            exit 1
          fi
